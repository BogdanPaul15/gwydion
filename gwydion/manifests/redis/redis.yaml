kind: Namespace
apiVersion: v1
metadata:
  name: redis
  labels:
    name: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-follower
  namespace: redis
  labels:
    app: redis-follower
    role: follower
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-follower
  template:
    metadata:
      labels:
        app: redis-follower
        role: follower
        tier: backend
    spec:
      containers:
      - name: follower
        image: gcr.io/google_samples/gb-redis-follower:v2
        resources:
          requests:
            cpu: 250m
            memory: 500Mi
          limits:
              cpu: 250m
              memory: 500Mi
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-follower
  namespace: redis
  labels:
    app: redis-follower
    role: follower
    tier: backend
spec:
  ports:
  - port: 6379
  selector:
    app: redis-follower
    role: follower
    tier: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-leader
  namespace: redis
  labels:
    app: redis-leader
    role: leader
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-leader
  template:
    metadata:
      labels:
        app: redis-leader
        role: leader
        tier: backend
    spec:
      containers:
      - name: leader
        image: "docker.io/redis:6.0.5"
        resources:
          requests:
            cpu: 250m
            memory: 500Mi
          limits:
            cpu: 250m
            memory: 500Mi
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-leader
  namespace: redis
  labels:
    app: redis-leader
    role: leader
    tier: backend
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis-leader
    role: leader
    tier: backend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-bench-script
  namespace: redis
data:
  bench.sh: |
    #!/bin/bash

    LEADER_HOST="${LEADER_HOST:-redis-leader.redis.svc}"
    PORT="${REDIS_PORT:-6379}"
    RANDOM=42

    echo "Redis-bench starting..."
    echo "Target: $LEADER_HOST:$PORT"

    while true; do
      CLIENTS=$(( RANDOM % 5000 + 10 ))
      SLEEP=$(( RANDOM % 60 + 1 ))

      echo "clients=$CLIENTS  next sleep=${SLEEP}s"
      redis-benchmark -h "$LEADER_HOST" -p "$PORT" -q -n "$CLIENTS"

      echo "Sleeping ${SLEEP}s..."
      sleep "$SLEEP"
    done

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-bench
  namespace: redis
  labels:
    app: redis-bench
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-bench
  template:
    metadata:
      labels:
        app: redis-bench
    spec:
      containers:
        - name: redis-bench
          image: redis:latest
          command: ["bash", "/scripts/bench.sh"]
          env:
            - name: LEADER_HOST
              value: "redis-leader.redis.svc"
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: redis-bench-script
            defaultMode: 0755